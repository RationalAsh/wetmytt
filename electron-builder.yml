appId: io.github.rationalash.wetmytt
productName: Welcome to My TED Talk
asar: true
beforePack: scripts/before-pack.cjs
extraResources:
  - from: build/git/${arch}
    to: git
    filter: ['**/*']
  - from: docs/git-notices.md
    to: git-notices.md
  - from: docs/licenses/git-COPYING
    to: git/COPYING
forceCodeSigning: true
publish:
  provider: github
  owner: RationalAsh
  repo: wetmytt
  releaseType: release
directories:
  output: dist
files:
  - electron/**/*
  - shared/**/*
  - templates/**/*
  - out/**/*
  - package.json
  - '!node_modules/dugite/git/**/*'
mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: wetmytt-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
dmg:
  sign: true
