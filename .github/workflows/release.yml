name: macOS release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version");'
      - name: Check signing and notarization secrets
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name; see docs/releases.md"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Build, sign, and notarize DMG
        run: npm run dist:mac:${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify app signature and notarization ticket
        run: |
          app=$(find dist -maxdepth 2 -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          codesign --verify --verbose=2 dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: dist
      - name: Create draft release with both DMGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.dmg > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Welcome to My TED Talk $GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/$GITHUB_REF_NAME.md"
